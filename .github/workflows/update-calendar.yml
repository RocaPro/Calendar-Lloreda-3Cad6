name: Actualizar calendario Asturfutbol

on:
  schedule:
    - cron: '0 6 * * *'   # Todos los días a las 7:00 hora España (aprox)
  workflow_dispatch:       # Permite ejecutarlo manualmente

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate ICS
        run: python generate_ics.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add lloreda-a.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática del calendario" && git push)
